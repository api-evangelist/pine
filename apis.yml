aid: pine
name: Pine
description: 'Pine is a Canadian digital-first mortgage lender and real estate brokerage
  (Pine Canada Financial Corporation / Pine Real Estate Brokerage) that makes home
  buying more accessible for Canadians through an online platform offering low interest
  rates, fast pre-approvals, and zero hidden fees. Backed by Greylock, Pine pairs mortgage
  origination with a REALTOR-affiliated brokerage licensed across multiple provinces
  (ON, AB, SK, NS, NB, NL), and reports more than $2B in mortgages funded and 100,000+
  clients served. Pine is a consumer fintech product with no public developer API;
  its backend at api.pine.ca is a private, authenticated service.'
